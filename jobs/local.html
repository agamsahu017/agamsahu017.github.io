<html lang="en">
<head>

<style>
  :root{--text:#0f172a;--muted:#475569;--line:#e2e8f0;--soft:#f4f7fd;--primary:#1d4ed8;--primary-soft:#e8efff;--wa:#16a34a;--warn:#92400e;--warnbg:#fffbeb;--warnline:#fcd34d;--bg:#fff;--card:#fff;--chip:#f1f5f9}
  @media (prefers-color-scheme:dark){:root{--text:#e2e8f0;--muted:#94a3b8;--line:#23314f;--soft:#111a2e;--primary:#60a5fa;--primary-soft:#172554;--wa:#22c55e;--warn:#fcd34d;--warnbg:#2a1f05;--warnline:#78350f;--bg:#0b1120;--card:#131d33;--chip:#1a2540}}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Nirmala UI",sans-serif;color:var(--text);background:var(--bg);line-height:1.55;font-size:17px}
  a{color:var(--primary)}
  .wrap{max-width:760px;margin:0 auto;padding:0 16px}
  header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:10px;padding-bottom:10px}
  .logo{font-weight:800;font-size:20px;color:var(--primary);text-decoration:none}
  .lang{font:inherit;font-size:15px;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:6px 14px;cursor:pointer}
  h1{font-size:27px;line-height:1.25;margin:22px 0 8px}
  .lead{color:var(--muted);margin:0 0 14px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:700;text-decoration:none;border:0;border-radius:12px;padding:11px 16px;cursor:pointer}
  .btn-wa{background:var(--wa);color:#fff}
  .btn-out{background:var(--card);color:var(--primary);border:1.5px solid var(--primary)}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row .btn{flex:1 1 220px}
  .safe{margin:18px 0;background:var(--warnbg);border:1px solid var(--warnline);color:var(--text);border-radius:14px;padding:12px 14px;font-size:15.5px}
  .safe b{color:var(--warn)}
  .filters{margin:20px 0 8px}
  .label{font-size:14px;font-weight:700;color:var(--muted);margin:10px 0 6px}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
  .chip{flex:0 0 auto;font:inherit;font-size:15px;border:1px solid var(--line);background:var(--chip);color:var(--text);border-radius:999px;padding:7px 13px;cursor:pointer;white-space:nowrap}
  .chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#fff}
  .count{color:var(--muted);font-size:15px;margin:12px 0}
  .job{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:0 0 12px}
  .job.hl{border:2px solid var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
  .job h2{font-size:19px;margin:0 0 4px}
  .meta{color:var(--muted);font-size:15px;margin:0 0 8px}
  .salary{font-weight:800;font-size:18px;color:var(--wa);margin:0 0 8px}
  .facts{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px;padding:0;list-style:none}
  .facts li{font-size:14px;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:3px 9px}
  .tag-ok{color:var(--wa);font-weight:700}
  .details{font-size:15.5px;margin:0 0 12px;white-space:pre-line}
  .job .row .btn{flex:1 1 160px;padding:10px 12px;font-size:16px}
  .empty{background:var(--soft);border:1px dashed var(--line);border-radius:16px;padding:22px 16px;text-align:center}
  .empty p{margin:6px 0}
  section.box{background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:16px;margin:24px 0}
  section.box h2{font-size:20px;margin:0 0 6px}
  section.box p{margin:0 0 12px;color:var(--muted)}
  ul.tips{margin:0;padding-left:20px}
  ul.tips li{margin:4px 0}
  footer{padding:24px 0 40px;color:var(--muted);font-size:14px}
  .src{font-size:14px;color:var(--muted);margin:0 0 10px}
  .links h3{font-size:16px;margin:14px 0 8px}
  .links .chips{flex-wrap:wrap;overflow:visible}
  .links a.chip{text-decoration:none;background:var(--card)}
</style>
</head>
<body>
<header><div class="wrap bar">

<main class="wrap">

<script>
(function () {
  const WA = '919235266579';
  const PAGE_URL = 'https://agamsahu017.github.io/jobs/local.html';
  const NCR = ['Delhi', 'New Delhi', 'Noida', 'Greater Noida', 'Gurugram', 'Gurgaon', 'Ghaziabad', 'Faridabad'];

  const T = {
    en: {
      h1: 'Local jobs in Lucknow and Delhi NCR',
      lead: 'Front office, back office, telecaller, store and mall jobs from trusted job sites. Updated every day. Free.',
      sharePage: '📤 Share this page on WhatsApp',
      sitesBtn: '🔎 Search on job sites',
      safe: '<b>⚠️ Stay safe:</b> These jobs come from other job sites. Kodivo does not check each one. A real employer never asks for money: never pay a "registration fee", "training fee" or "uniform deposit". Never share an OTP. Go for interviews only to an office, shop or mall, in the daytime.',
      cityLabel: 'City', typeLabel: 'Job type',
      all: 'All', lko: 'Lucknow', ncr: 'Delhi NCR',
      count: (n) => n === 1 ? '1 job' : n + ' jobs',
      updated: (d) => 'Updated ' + d,
      emptyH: 'No jobs found here right now',
      emptyP: 'Try another city or job type, or search on the job sites below.',
      apply: '✅ Apply on WhatsApp', share: '📤 Share',
      applyOn: (s) => 'Apply on ' + s + ' ↗',
      source: (s) => 'Source: ' + s + ' · not checked by Kodivo',
      salary: (a, b) => b && b !== a ? '₹' + inr(a) + ' – ₹' + inr(b) + ' / month' : '₹' + inr(a) + ' / month',
      salaryNA: 'Salary: ask the employer',
      openings: (n) => n + (n === 1 ? ' opening' : ' openings'),
      verified: '✔ Checked by Kodivo',
      posted: 'Posted', lastDate: 'Last date',
      sitesH: 'Search on trusted job sites',
      sitesP: 'These links open a search for the city and job type you picked above.',
      privateSites: 'Job sites',
      govtSites: 'Government portals (free, safe)',
      tipsH: 'Tips for the interview',
      tips: [
        'Keep 2 printed copies of your resume, an Aadhaar copy and 2 photos.',
        'Wear clean, simple clothes. Reach 10 minutes early.',
        'Say your name, education and work experience in 1 minute. Practise it once at home.',
        'For telecaller and front office jobs, speak clearly and politely. That matters more than English.',
        'Ask about salary, timings, weekly off, and when salary is paid each month.',
        'Before joining, ask for an offer or appointment letter.',
      ],
      foot: 'Kodivo · Lucknow & Delhi NCR · Kodivo does not charge job seekers',
      pageShareMsg: 'Free local jobs in Lucknow and Delhi NCR: front office, telecaller, store, back office and mall jobs. Updated daily.\n' + PAGE_URL + '?lang=hi',
      applyMsg: (j) => 'Hi Kodivo, I want to apply for job ' + j.id + ': ' + j.title + ', ' + place(j) + '.\nName:\nQualification:\nExperience:\nI will send my resume here.',
      shareMsg: (j) => '💼 Job: ' + j.title + ' (' + place(j) + ')\n' + (j.salary_min ? '₹' + inr(j.salary_min) + (j.salary_max && j.salary_max !== j.salary_min ? '–' + inr(j.salary_max) : '') + '/month\n' : '') + 'See and apply: ' + PAGE_URL + '?id=' + encodeURIComponent(j.id),
    },
    hi: {
      h1: 'लखनऊ और दिल्ली NCR में लोकल नौकरियाँ',
      lead: 'भरोसेमंद जॉब साइट्स से फ्रंट ऑफिस, बैक ऑफिस, टेलीकॉलर, स्टोर और मॉल की नौकरियाँ। रोज़ अपडेट। बिल्कुल फ़्री।',
      sharePage: '📤 ये पेज WhatsApp पर शेयर करें',
      sitesBtn: '🔎 जॉब साइट्स पर खोजें',
      safe: '<b>⚠️ सावधान रहें:</b> ये नौकरियाँ दूसरी जॉब साइट्स से आती हैं। Kodivo हर नौकरी को चेक नहीं करता। असली कंपनी कभी पैसे नहीं माँगती: "रजिस्ट्रेशन फ़ीस", "ट्रेनिंग फ़ीस" या "यूनिफ़ॉर्म डिपॉज़िट" कभी न दें। OTP कभी शेयर न करें। इंटरव्यू के लिए सिर्फ़ ऑफ़िस, दुकान या मॉल में, दिन में ही जाएँ।',
      cityLabel: 'शहर', typeLabel: 'नौकरी का प्रकार',
      all: 'सभी', lko: 'लखनऊ', ncr: 'दिल्ली NCR',
      count: (n) => n + ' नौकरियाँ',
      updated: (d) => 'अपडेट: ' + d,
      emptyH: 'अभी यहाँ कोई नौकरी नहीं मिली',
      emptyP: 'दूसरा शहर या नौकरी का प्रकार चुनें, या नीचे दी गई जॉब साइट्स पर खोजें।',
      apply: '✅ WhatsApp पर अप्लाई करें', share: '📤 शेयर करें',
      applyOn: (s) => s + ' पर अप्लाई करें ↗',
      source: (s) => 'स्रोत: ' + s + ' · Kodivo ने चेक नहीं किया',
      salary: (a, b) => b && b !== a ? '₹' + inr(a) + ' – ₹' + inr(b) + ' / महीना' : '₹' + inr(a) + ' / महीना',
      salaryNA: 'सैलरी: कंपनी से पूछें',
      openings: (n) => n + ' पद',
      verified: '✔ Kodivo ने चेक किया',
      posted: 'डाली गई', lastDate: 'आख़िरी तारीख़',
      sitesH: 'भरोसेमंद जॉब साइट्स पर खोजें',
      sitesP: 'ये लिंक ऊपर चुने गए शहर और नौकरी के प्रकार की खोज खोलते हैं।',
      privateSites: 'जॉब साइट्स',
      govtSites: 'सरकारी पोर्टल (फ़्री, सुरक्षित)',
      tipsH: 'इंटरव्यू के लिए टिप्स',
      tips: [
        'Resume की 2 प्रिंट कॉपी, आधार की कॉपी और 2 फ़ोटो साथ रखें।',
        'साफ़ और सादे कपड़े पहनें। 10 मिनट पहले पहुँचें।',
        'अपना नाम, पढ़ाई और काम का अनुभव 1 मिनट में बताएँ। घर पर एक बार प्रैक्टिस करें।',
        'टेलीकॉलर और फ्रंट ऑफिस जॉब में साफ़ और विनम्र तरीके से बोलें। ये अंग्रेज़ी से ज़्यादा ज़रूरी है।',
        'सैलरी, टाइमिंग, वीकली ऑफ़ और हर महीने सैलरी कब मिलती है, ये ज़रूर पूछें।',
        'जॉइन करने से पहले ऑफ़र या अपॉइंटमेंट लेटर माँगें।',
      ],
      foot: 'Kodivo · लखनऊ और दिल्ली NCR · Kodivo नौकरी ढूँढने वालों से कोई फ़ीस नहीं लेता',
      pageShareMsg: 'लखनऊ और दिल्ली NCR की लोकल नौकरियाँ, फ़्री: फ्रंट ऑफिस, टेलीकॉलर, स्टोर, बैक ऑफिस और मॉल जॉब्स। रोज़ अपडेट।\n' + PAGE_URL + '?lang=hi',
      applyMsg: (j) => 'Hi Kodivo, मुझे जॉब ' + j.id + ' के लिए अप्लाई करना है: ' + j.title + ', ' + place(j) + '।\nनाम:\nपढ़ाई:\nअनुभव:\nमैं अपना resume यहीं भेज दूँगा/दूँगी।',
      shareMsg: (j) => '💼 जॉब: ' + j.title + ' (' + place(j) + ')\n' + (j.salary_min ? '₹' + inr(j.salary_min) + (j.salary_max && j.salary_max !== j.salary_min ? '–' + inr(j.salary_max) : '') + '/महीना\n' : '') + 'देखें और अप्लाई करें: ' + PAGE_URL + '?id=' + encodeURIComponent(j.id) + '&lang=hi',
    },
  };

  // term = what to search on other job sites for this type
  const TYPES = [
    { k: 'all', term: '' },
    { k: 'front-office', en: 'Front office / Reception', hi: 'फ्रंट ऑफिस / रिसेप्शन', term: 'front office' },
    { k: 'back-office', en: 'Back office / Data entry', hi: 'बैक ऑफिस / डेटा एंट्री', term: 'back office' },
    { k: 'telecaller', en: 'Telecaller / BPO', hi: 'टेलीकॉलर / BPO', term: 'telecaller' },
    { k: 'store-manager', en: 'Store manager', hi: 'स्टोर मैनेजर', term: 'store manager' },
    { k: 'store-assistant', en: 'Store assistant / Sales staff', hi: 'स्टोर असिस्टेंट / सेल्स स्टाफ़', term: 'retail sales' },
    { k: 'mall', en: 'Mall jobs', hi: 'मॉल जॉब्स', term: 'mall' },
    { k: 'accounts', en: 'Accounts / Billing', hi: 'अकाउंट्स / बिलिंग', term: 'accountant' },
    { k: 'field-sales', en: 'Field sales / Marketing', hi: 'फ़ील्ड सेल्स / मार्केटिंग', term: 'field sales' },
    { k: 'delivery', en: 'Delivery / Driver', hi: 'डिलीवरी / ड्राइवर', term: 'delivery' },
    { k: 'security', en: 'Security / Housekeeping', hi: 'सिक्योरिटी / हाउसकीपिंग', term: 'security guard' },
    { k: 'other', en: 'Other', hi: 'अन्य', term: '' },
  ];
  const CITIES = ['all', 'lko', 'ncr'];
  const SOURCE_SITES = { Adzuna: 'https://www.adzuna.in/', Jooble: 'https://in.jooble.org/' };

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function inr(n) { return Number(n).toLocaleString('en-IN'); }
  function place(j) { return [j.area, j.city].filter(Boolean).join(', '); }
  function wa(text) { return 'https://wa.me/' + WA + '?text=' + encodeURIComponent(text); }
  function store(get, val) { try { return get ? localStorage.getItem('kodivo-local-jobs-lang') : localStorage.setItem('kodivo-local-jobs-lang', val); } catch (e) { return null; } }
  function today() { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
  function fmtDate(s, lang) { return s ? new Date(s.slice(0, 10) + 'T00:00:00').toLocaleDateString(lang === 'hi' ? 'hi-IN' : 'en-IN', { day: 'numeric', month: 'short' }) : ''; }
  function isNcr(c) { return NCR.some((x) => x.toLowerCase() === String(c || '').toLowerCase()); }
  const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

  const params = new URLSearchParams(location.search);
  let lang = params.get('lang') === 'hi' || params.get('lang') === 'en' ? params.get('lang') : (store(true) === 'hi' ? 'hi' : 'en');
  let city = CITIES.includes(params.get('city')) ? params.get('city') : 'all';
  let type = TYPES.some((t) => t.k === params.get('type')) ? params.get('type') : 'all';
  const focusId = (params.get('id') || '').toUpperCase();
  let jobs = [];
  let feedInfo = { updated: null, sources: [] };
  let loaded = false;

  function typeLabel(k) { const t = TYPES.find((x) => x.k === k) || TYPES[TYPES.length - 1]; return k === 'all' ? T[lang].all : t[lang]; }

  function chips(box, keys, current, label, onPick) {
    box.innerHTML = keys.map((k) => '<button type="button" class="chip" data-k="' + k + '" aria-pressed="' + (k === current) + '">' + esc(label(k)) + '</button>').join('');
    box.querySelectorAll('.chip').forEach((b) => b.addEventListener('click', () => onPick(b.dataset.k)));
    const on = box.querySelector('[aria-pressed="true"]');
    if (on) { const x = on.offsetLeft - box.offsetLeft; if (x + on.offsetWidth > box.clientWidth) box.scrollLeft = x - 16; }
  }

  function visible() {
    const now = today();
    return jobs
      .filter((j) => !j.expires || j.expires >= now)
      .filter((j) => city === 'all' || (city === 'lko' ? String(j.city).toLowerCase() === 'lucknow' : isNcr(j.city)))
      .filter((j) => type === 'all' || j.category === type || (type === 'mall' && j.mall))
      .sort((a, b) => {
        if (String(a.id).toUpperCase() === focusId) return -1;
        if (String(b.id).toUpperCase() === focusId) return 1;
        if (!!a.verified !== !!b.verified) return a.verified ? -1 : 1; // jobs Kodivo checked come first
        return String(b.posted || '').localeCompare(String(a.posted || ''));
      });
  }

  function card(j) {
    const L = T[lang];
    const facts = [typeLabel(j.category)];
    if (j.mall && j.category !== 'mall') facts.push(typeLabel('mall'));
    if (j.shift) facts.push('🕘 ' + j.shift);
    if (j.experience) facts.push('💼 ' + j.experience);
    if (j.education) facts.push('🎓 ' + j.education);
    if (j.openings) facts.push('👥 ' + L.openings(j.openings));
    const dates = [j.posted ? L.posted + ': ' + fmtDate(j.posted, lang) : '', j.expires ? L.lastDate + ': ' + fmtDate(j.expires, lang) : ''].filter(Boolean).join(' · ');
    const external = j.source && /^https:\/\//.test(j.url || '');
    const applyBtn = external
      ? '<a class="btn btn-wa" target="_blank" rel="noopener nofollow" href="' + esc(j.url) + '">' + esc(L.applyOn(j.source)) + '</a>'
      : '<a class="btn btn-wa" target="_blank" rel="noopener" href="' + wa(L.applyMsg(j)) + '">' + esc(L.apply) + '</a>';
    return '<article class="job' + (String(j.id).toUpperCase() === focusId ? ' hl' : '') + '" id="job-' + esc(String(j.id).toUpperCase()) + '">' +
      '<h2>' + esc(j.title) + '</h2>' +
      '<p class="meta">📍 ' + esc(place(j)) + (j.company ? ' · 🏢 ' + esc(j.company) : '') + (j.verified ? ' · <span class="tag-ok">' + esc(L.verified) + '</span>' : '') + '</p>' +
      (j.salary_min ? '<p class="salary">' + esc(L.salary(j.salary_min, j.salary_max)) + '</p>' : '<p class="meta">💰 ' + esc(L.salaryNA) + '</p>') +
      '<ul class="facts">' + facts.map((f) => '<li>' + esc(f) + '</li>').join('') + '</ul>' +
      (j.details || j.snippet ? '<p class="details">' + esc(j.details || j.snippet) + '</p>' : '') +
      (external ? '<p class="src">' + esc(L.source(j.source)) + '</p>' : '') +
      '<p class="meta">' + esc(dates) + '</p>' +
      '<div class="row">' + applyBtn +
      '<a class="btn btn-out" target="_blank" rel="noopener" href="https://wa.me/?text=' + encodeURIComponent(L.shareMsg(j)) + '">' + esc(L.share) + '</a></div>' +
      '</article>';
  }

  function siteLinks() {
    const L = T[lang];
    const term = (TYPES.find((t) => t.k === type) || TYPES[0]).term;
    const places = city === 'lko' ? ['Lucknow'] : city === 'ncr' ? ['Delhi NCR'] : ['Lucknow', 'Delhi NCR'];
    const q = (p) => (term ? term + ' ' : '') + 'jobs in ' + p;
    const enc = encodeURIComponent;
    let html = '';
    for (const p of places) {
      const indeedLoc = p === 'Delhi NCR' ? 'Delhi' : p;
      const naukri = 'https://www.naukri.com/' + (term ? slug(term) + '-' : '') + 'jobs-in-' + slug(p);
      const links = [
        ['Naukri', naukri],
        ['Indeed', 'https://in.indeed.com/jobs?q=' + enc(term) + '&l=' + enc(indeedLoc)],
        ['LinkedIn', 'https://www.linkedin.com/jobs/search/?keywords=' + enc(term) + '&location=' + enc(indeedLoc)],
        ['Google Jobs', 'https://www.google.com/search?q=' + enc(q(p)) + '&ibp=htl;jobs'],
      ];
      html += '<h3>' + esc(L.privateSites) + ': ' + esc(p === 'Lucknow' ? L.lko : L.ncr) + (term ? ' · ' + esc(typeLabel(type)) : '') + '</h3><div class="chips">' +
        links.map(([n, u]) => '<a class="chip" target="_blank" rel="noopener nofollow" href="' + esc(u) + '">' + esc(n) + ' ↗</a>').join('') + '</div>';
    }
    const govt = [['National Career Service (NCS)', 'https://www.ncs.gov.in/']];
    if (city !== 'ncr') govt.push(['UP Rojgaar Sangam', 'https://rojgaarsangam.up.gov.in/']);
    html += '<h3>' + esc(L.govtSites) + '</h3><div class="chips">' + govt.map(([n, u]) => '<a class="chip" target="_blank" rel="noopener" href="' + u + '">' + esc(n) + ' ↗</a>').join('') + '</div>';
    $('siteLinks').innerHTML = html;
  }

  function render() {
    const L = T[lang];
    document.documentElement.lang = lang;
    $('lang').textContent = lang === 'hi' ? 'English' : 'हिंदी';
    document.querySelectorAll('[data-t]').forEach((el) => {
      const v = L[el.dataset.t];
      if (typeof v === 'string') el.innerHTML = v;
    });
    $('tips').innerHTML = L.tips.map((t) => '<li>' + esc(t) + '</li>').join('');
    $('shareBtn').href = 'https://wa.me/?text=' + encodeURIComponent(L.pageShareMsg);
    chips($('cities'), CITIES, city, (k) => L[k], (k) => { city = k; render(); });
    chips($('types'), TYPES.map((t) => t.k), type, typeLabel, (k) => { type = k; render(); });
    siteLinks();

    const list = visible();
    $('count').textContent = loaded ? L.count(list.length) + (feedInfo.updated ? ' · ' + L.updated(fmtDate(feedInfo.updated, lang)) : '') : '';
    $('list').innerHTML = list.length
      ? list.map(card).join('')
      : loaded ? '<div class="empty"><p><b>' + esc(L.emptyH) + '</b></p><p>' + esc(L.emptyP) + '</p><p><a class="btn btn-out" href="#sites">' + esc(L.sitesBtn) + '</a></p></div>' : '';
    const credits = (feedInfo.sources || []).filter((s) => SOURCE_SITES[s]);
    $('credit').innerHTML = credits.length ? 'Jobs by ' + credits.map((s) => '<a href="' + SOURCE_SITES[s] + '" target="_blank" rel="noopener">' + s + '</a>').join(' and ') + ' · ' : '';
  }

  // Google for Jobs: only for jobs Kodivo checked itself (never for jobs taken from other sites).
  function addJsonLd() {
    const now = today();
    jobs.filter((j) => j.verified && !j.source && j.company && (!j.expires || j.expires >= now)).forEach((j) => {
      const s = document.createElement('script');
      s.type = 'application/ld+json';
      s.textContent = JSON.stringify({
        '@context': 'https://schema.org/', '@type': 'JobPosting',
        title: j.title, description: '<p>' + esc(j.details || j.title) + '</p>',
        identifier: { '@type': 'PropertyValue', name: 'Kodivo', value: j.id },
        datePosted: j.posted, validThrough: j.expires ? j.expires + 'T23:59' : undefined,
        employmentType: j.employment_type || 'FULL_TIME',
        hiringOrganization: { '@type': 'Organization', name: j.company },
        jobLocation: { '@type': 'Place', address: { '@type': 'PostalAddress', addressLocality: j.city, streetAddress: j.area, addressRegion: ['Noida', 'Greater Noida', 'Ghaziabad', 'Lucknow'].includes(j.city) ? 'UP' : ['Gurugram', 'Gurgaon', 'Faridabad'].includes(j.city) ? 'HR' : 'DL', addressCountry: 'IN' } },
        baseSalary: j.salary_min ? { '@type': 'MonetaryAmount', currency: 'INR', value: { '@type': 'QuantitativeValue', minValue: j.salary_min, maxValue: j.salary_max || j.salary_min, unitText: 'MONTH' } } : undefined,
      });
      document.head.appendChild(s);
    });
  }

  $('lang').addEventListener('click', () => { lang = lang === 'hi' ? 'en' : 'hi'; store(false, lang); render(); });

  const get = (f) => fetch(f + '?t=' + Date.now(), { cache: 'no-store' }).then((r) => (r.ok ? r.json() : null)).catch(() => null);
  render();
  Promise.all([get('local-jobs.json'), get('feed.json')]).then(([own, feed]) => {
    const mine = Array.isArray(own) ? own : [];
    const fed = feed && Array.isArray(feed.jobs) ? feed.jobs : [];
    feedInfo = { updated: feed && feed.updated, sources: (feed && feed.sources) || [] };
    jobs = mine.concat(fed).filter((j) => j && j.id && j.title);
    loaded = true;
    addJsonLd();
    render();
    if (focusId) { const el = document.getElementById('job-' + focusId); if (el) el.scrollIntoView({ block: 'center' }); }
  });
})();
</script>
</body>
</html>
