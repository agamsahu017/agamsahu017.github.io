name: Update local jobs feed

on:
  schedule:
    - cron: '30 0 * * *'   # every day at 6:00 AM IST
  workflow_dispatch:        # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: local-jobs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch jobs
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_KEY: ${{ secrets.JOOBLE_KEY }}
        run: node .github/scripts/fetch-local-jobs.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- jobs/feed.json; then echo "No change"; exit 0; fi
          git config user.name "kodivo-jobs-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs/feed.json
          git commit -m "Update local jobs feed"
          git pull --rebase
          git push
