<!doctype html>
<!-- Source for assets/og-image.png (link preview card). Render at 1200x630. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: "Poppins", sans-serif; color: #fff;
    background: radial-gradient(circle at 85% 20%, #7c3aed 0, transparent 45%), linear-gradient(135deg, #1d4ed8, #4f46e5); }
  .wrap { height: 100%; display: grid; grid-template-columns: 1.35fr 1fr; align-items: center; padding: 0 64px; gap: 40px; }
  .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; }
  .badge { width: 68px; height: 68px; border-radius: 18px; background: #fff; color: #1d4ed8; display: grid; place-items: center; font-weight: 800; font-size: 40px; }
  .brand b { font-size: 40px; font-weight: 700; }
  h1 { font-size: 54px; line-height: 1.12; font-weight: 800; }
  h1 em { font-style: normal; color: #fde68a; }
  p { margin-top: 18px; font-size: 25px; color: #e0e7ff; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
  .chips span { background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.35); padding: 8px 16px; border-radius: 999px; font-size: 19px; font-weight: 500; }
  .photo { justify-self: center; text-align: center; }
  .ring { width: 330px; height: 330px; border-radius: 50%; padding: 8px; background: linear-gradient(135deg, #fde68a, #f97316, #fff); }
  .ring img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; object-position: 50% 22%; border: 6px solid #4338ca; }
  .tag { display: inline-block; margin-top: -26px; position: relative; background: #0f172a; padding: 8px 18px; border-radius: 999px; font-weight: 600; font-size: 19px; }
</style>
</head>
<body>
  <div class="wrap">
    <div>
      <div class="brand"><div class="badge">K</div><b>Kodivo</b></div>
      <h1>AI chatbots, websites &amp; <em>smart software</em> for your business</h1>
      <p>AI-first software studio · Delhi NCR &amp; Lucknow</p>
      <div class="chips"><span>🤖 AI Chatbots</span><span>💬 WhatsApp Automation</span><span>🎓 Full Stack + AI Mentoring</span></div>
    </div>
    <div class="photo">
      <div class="ring"><img src="../agam.jpg" alt="" /></div>
      <div class="tag">Agam Sahu · Founder</div>
    </div>
  </div>
</body>
</html>
