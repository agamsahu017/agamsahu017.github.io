<!doctype html>
<html><head><meta charset="utf-8">
<!-- Fictional handwritten "kachha" bill for the Bill Reader demo. Render at 720x960. The total is wrong on purpose. -->
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;width:720px;height:960px;background:#6b4f3a}
  .paper{position:absolute;left:46px;top:36px;width:620px;height:880px;transform:rotate(1.4deg);
    background:repeating-linear-gradient(#fdfbf3 0 41px,#b9cde6 41px 42px);box-shadow:0 8px 20px rgba(0,0,0,.4);
    font-family:'Kalam',cursive;color:#1b2a7a;padding:26px 34px;box-sizing:border-box}
  .paper:before{content:"";position:absolute;left:70px;top:0;bottom:0;width:2px;background:#e5a3a3}
  .head{text-align:center;color:#a01818;font-family:Arial,sans-serif}
  .head b{font-size:28px;letter-spacing:1px} .head div{font-size:14px;color:#444}
  .row{display:flex;font-size:25px;line-height:42px;padding-left:46px}
  .row span:nth-child(1){flex:1} .row span:nth-child(2){width:120px} .row span:nth-child(3){width:110px;text-align:right}
  .stamp{position:absolute;right:60px;top:560px;transform:rotate(12deg);border:3px solid rgba(200,30,30,.5);color:rgba(200,30,30,.5);font:900 30px Arial;padding:2px 12px;letter-spacing:3px}
</style></head><body>
<div class="paper">
  <div class="stamp">SAMPLE</div>
  <div class="head"><b>GUPTA KIRANA STORE</b><div>Chowk, Lucknow · Mob 90000 00000 · (fictional sample)</div></div>
  <div class="row" style="margin-top:22px"><span>Shri Verma ji</span><span></span><span>14/11/26</span></div>
  <div class="row"><span>Chawal 25kg</span><span>1 x 1250</span><span>1250</span></div>
  <div class="row"><span>Atta 10kg</span><span>2 x 380</span><span>760</span></div>
  <div class="row"><span>Cheeni 5kg</span><span>1 x 220</span><span>220</span></div>
  <div class="row"><span>Sarson tel 1L</span><span>3 x 165</span><span>495</span></div>
  <div class="row"><span></span><span></span><span>———</span></div>
  <div class="row" style="font-weight:700"><span>Total</span><span></span><span>2825/-</span></div>
  <div class="row"><span>Cash</span><span></span><span></span></div>
</div>
</body></html>
